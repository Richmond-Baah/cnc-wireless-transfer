<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('cnc.theme') || 'system'; } catch (e) {}</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-in">
            <span class="brand">
                <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#C2410C"/><path d="M14 6v10M9.5 10.5 14 6l4.5 4.5M7 19h14v3H7z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-t="app.name"></span>
            </span>
            <div class="topbar-actions">
                <div class="theme-switch" role="group" data-t-aria="hdr.theme">
                    <button type="button" class="icon-btn" data-theme-choice="system" data-t-aria="hdr.theme.system" data-t-title="hdr.theme.system"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
                    <button type="button" class="icon-btn" data-theme-choice="light" data-t-aria="hdr.theme.light" data-t-title="hdr.theme.light"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
                    <button type="button" class="icon-btn" data-theme-choice="dark" data-t-aria="hdr.theme.dark" data-t-title="hdr.theme.dark"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
                </div>
            </div>
        </div>
    </header>
    <main class="login-wrap">
        <h1 data-t="login.heading"></h1>
        <p class="sub" data-t="login.sub"></p>
        <form id="loginForm" class="card" novalidate>
            <div id="loginError" class="form-error" role="alert" hidden></div>
            <div class="field">
                <label for="username" data-t="login.user"></label>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
            </div>
            <div class="field">
                <label for="password" data-t="login.pass"></label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-t="login.submit"></button>
        </form>
    </main>
    <script src="strings.js"></script>
    <script src="app.js"></script>
</body>
</html>
