<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Machines</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('cnc.theme') || 'system'; } catch (e) {}</script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-in">
            <a class="brand" href="upload.html">
                <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#C2410C"/><path d="M14 6v10M9.5 10.5 14 6l4.5 4.5M7 19h14v3H7z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-t="app.name"></span>
            </a>
            <span id="netChip" class="net-chip" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg><span id="netChipText"></span></span>
            <div class="topbar-actions">
                <div class="theme-switch" role="group" data-t-aria="hdr.theme">
                    <button type="button" class="icon-btn" data-theme-choice="system" data-t-aria="hdr.theme.system" data-t-title="hdr.theme.system"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
                    <button type="button" class="icon-btn" data-theme-choice="light" data-t-aria="hdr.theme.light" data-t-title="hdr.theme.light"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
                    <button type="button" class="icon-btn" data-theme-choice="dark" data-t-aria="hdr.theme.dark" data-t-title="hdr.theme.dark"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
                </div>
                <button type="button" id="configBtn" class="bar-btn" data-t-aria="hdr.settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl" data-t="hdr.settings"></span></button>
                <button type="button" id="logoutBtn" class="bar-btn" data-t-aria="hdr.logout"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl" data-t="hdr.logout"></span></button>
            </div>
        </div>
    </header>
    <main class="page" id="dashView">
        <div class="dash">
            <section class="dash-left" aria-labelledby="mcHeading">
                <h2 id="mcHeading" class="section-title" data-t="mc.heading"></h2>
                <div id="foundNotice" class="found" hidden>
                    <span id="foundText"></span>
                    <button type="button" id="foundReview" class="btn btn-primary" data-t="mc.review"></button>
                </div>
                <div id="machineList" class="machine-list"></div>
                <button type="button" id="addMachineBtn" class="btn btn-dashed">
                    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-t="mc.add"></span>
                </button>
            </section>

            <div class="dash-right">
                <section class="card" id="transferCard" aria-live="polite">
                    <div class="tx-head">
                        <div class="tx-title">
                            <h2 id="txName"></h2>
                            <p id="txSub" class="muted small"></p>
                        </div>
                        <span id="txPill" class="pill" hidden></span>
                    </div>

                    <div id="fileZone" class="drop">
                        <input type="file" id="fileInput" class="visually-hidden" tabindex="-1">
                        <div id="dropEmpty" class="drop-empty">
                            <svg class="i drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                            <span data-t="file.drop"></span>
                            <button type="button" class="btn" id="chooseFileBtn" data-t="file.choose"></button>
                            <span id="fileTypes" class="muted small"></span>
                        </div>
                        <div id="dropFile" class="file-row" hidden>
                            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
                            <div class="file-meta">
                                <div id="fileName" class="mono file-name"></div>
                                <div class="small"><span id="fileSize" class="muted"></span> · <span id="fileFit"></span></div>
                                <div id="fileOdd" class="small busy-text" hidden></div>
                            </div>
                            <button type="button" class="btn btn-ghost" id="chooseAnotherBtn" data-t="file.chooseAnother"></button>
                        </div>
                    </div>

                    <div id="progressBox" class="progress" hidden>
                        <div class="progress-top">
                            <span id="progressText" class="small"></span>
                            <span id="progressPct" class="progress-pct">0%</span>
                        </div>
                        <div class="bar"><div id="progressFill" class="bar-fill"></div></div>
                        <ol class="stepper" id="stepper">
                            <li data-t="step.upload"></li>
                            <li data-t="step.verify"></li>
                            <li data-t="step.reconnect"></li>
                            <li data-t="step.done"></li>
                        </ol>
                    </div>

                    <div id="msgBox" class="msg" hidden></div>

                    <div class="tx-actions">
                        <button type="button" id="uploadBtn" class="btn btn-primary" disabled></button>
                        <button type="button" id="cancelBtn" class="btn" data-t="tx.cancel" hidden></button>
                    </div>
                </section>

                <section class="card" id="filesCard">
                    <div class="card-head">
                        <h2 id="filesHeading"></h2>
                        <button type="button" id="deleteSelectedBtn" class="btn btn-danger" hidden></button>
                        <button type="button" id="refreshFilesBtn" class="btn">
                            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></svg><span data-t="files.refresh"></span>
                        </button>
                    </div>
                    <p id="filesCached" class="muted small files-note" data-t="files.cached" hidden></p>
                    <div id="filesConfirm" class="confirm" hidden></div>
                    <p id="filesNote" class="files-feedback small" hidden></p>
                    <div id="fileTable"></div>
                    <div class="files-foot">
                        <button type="button" id="wipeBtn" class="btn btn-ghost danger-text" data-t="files.wipe"></button>
                    </div>
                </section>
            </div>
        </div>

    </main>

    <!-- Settings page -->
    <main class="page" id="settingsView" hidden>
        <a href="#" class="back-link"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span data-t="set.back"></span></a>
        <h1 class="page-title" data-t="set.title"></h1>
        <div class="settings">
            <nav class="set-nav" aria-labelledby="setNavLabel">
                <span id="setNavLabel" class="visually-hidden" data-t="set.title"></span>
                <a href="#settings/network" data-sec="network" data-t="set.nav.network"></a>
                <a href="#settings/machines" data-sec="machines" data-t="set.nav.machines"></a>
                <a href="#settings/login" data-sec="login" data-t="set.nav.login"></a>
                <a href="#settings/appearance" data-sec="appearance" data-t="set.nav.appearance"></a>
                <a href="#settings/system" data-sec="system" data-t="set.nav.system"></a>
            </nav>
            <div class="set-panels">
                <section class="card set-panel" data-panel="network" aria-labelledby="hNet">
                    <h2 id="hNet" data-t="set.nav.network"></h2>
                    <form id="netForm" novalidate>
                        <fieldset class="field">
                            <legend class="label" data-t="net.router"></legend>
                            <label class="radio-card"><input type="radio" name="wifi_mode" value="AP">
                                <span><b data-t="net.router.no"></b><span class="muted small" data-t="net.router.noHint"></span></span></label>
                            <label class="radio-card"><input type="radio" name="wifi_mode" value="STA">
                                <span><b data-t="net.router.yes"></b><span class="muted small" data-t="net.router.yesHint"></span></span></label>
                        </fieldset>
                        <div id="routerFields">
                            <div class="field">
                                <label for="staSsid" data-t="net.routerName"></label>
                                <input type="text" id="staSsid" name="sta_ssid" maxlength="31" autocomplete="off">
                            </div>
                            <div class="field">
                                <label for="staPass" data-t="net.routerPass"></label>
                                <input type="password" id="staPass" name="sta_pass" maxlength="63" autocomplete="new-password" data-t-ph="set.keep">
                            </div>
                            <p id="staStatus" class="status-line small" hidden></p>
                        </div>
                        <h3 class="sub-title" data-t="net.own"></h3>
                        <div class="field">
                            <label for="apSsid" data-t="net.ownName"></label>
                            <input type="text" id="apSsid" name="ap_ssid" maxlength="31" autocomplete="off">
                        </div>
                        <div class="field">
                            <label for="apPass" data-t="net.ownPass"></label>
                            <input type="password" id="apPass" name="ap_pass" maxlength="63" autocomplete="new-password" aria-describedby="apPassHint">
                            <p class="hint" id="apPassHint" data-t="net.ownPassHint"></p>
                        </div>
                        <div id="offlineWarn" class="warn" hidden></div>
                        <button type="submit" class="btn btn-primary" data-t="set.save"></button>
                        <p class="form-status small" hidden></p>
                    </form>
                </section>

                <section class="card set-panel" data-panel="machines" aria-labelledby="hMac" hidden>
                    <h2 id="hMac" data-t="set.nav.machines"></h2>
                    <p id="macStatus" class="form-status small" hidden></p>
                    <div id="macTable"></div>
                </section>

                <section class="card set-panel" data-panel="login" aria-labelledby="hLogin" hidden>
                    <h2 id="hLogin" data-t="set.nav.login"></h2>
                    <form id="loginSetForm" novalidate>
                        <h3 class="sub-title" data-t="login.section"></h3>
                        <div class="field">
                            <label for="authUser" data-t="login.user"></label>
                            <input type="text" id="authUser" name="auth_user" maxlength="31" autocomplete="username" autocapitalize="none">
                        </div>
                        <div class="field">
                            <label for="authPass" data-t="login.newPass"></label>
                            <input type="password" id="authPass" name="auth_pass" maxlength="63" autocomplete="new-password" data-t-ph="set.keep">
                        </div>
                        <button type="submit" class="btn btn-primary" data-t="set.save"></button>
                        <p class="form-status small" hidden></p>
                    </form>
                </section>

                <section class="card set-panel" data-panel="appearance" aria-labelledby="hApp" hidden>
                    <h2 id="hApp" data-t="set.nav.appearance"></h2>
                    <h3 class="sub-title" data-t="app.section"></h3>
                    <div class="theme-cards">
                        <button type="button" class="theme-card" data-theme-choice="system">
                            <span class="tc-preview tc-split" aria-hidden="true"><span class="tc-l"><i></i><i></i></span><span class="tc-d"><i></i><i></i></span></span>
                            <b data-t="app.system"></b><span class="muted small" data-t="app.systemHint"></span>
                        </button>
                        <button type="button" class="theme-card" data-theme-choice="light">
                            <span class="tc-preview tc-l" aria-hidden="true"><i></i><i></i></span><b data-t="app.light"></b>
                        </button>
                        <button type="button" class="theme-card" data-theme-choice="dark">
                            <span class="tc-preview tc-d" aria-hidden="true"><i></i><i></i></span><b data-t="app.dark"></b>
                        </button>
                    </div>
                </section>

                <section class="card set-panel" data-panel="system" aria-labelledby="hSys" hidden>
                    <h2 id="hSys" data-t="set.nav.system"></h2>
                    <dl class="facts">
                        <dt data-t="sys.firmware"></dt><dd id="sysFw">-</dd>
                        <dt data-t="sys.deviceId"></dt><dd id="sysId" class="mono">-</dd>
                        <dt data-t="sys.devices"></dt><dd id="sysDevices">-</dd>
                    </dl>
                    <div class="recovery">
                        <h3 data-t="sys.recovery"></h3>
                        <p class="small" data-t="sys.recoveryWhy"></p>
                        <p id="recoveryOn" class="busy-text small" hidden></p>
                        <label class="label small" for="recoveryWord" data-t="sys.recoveryType"></label>
                        <div class="confirm-actions">
                            <input type="text" id="recoveryWord" class="confirm-word" autocomplete="off" autocapitalize="characters">
                            <button type="button" id="recoveryBtn" class="btn btn-danger" data-t="sys.recoveryBtn" disabled></button>
                        </div>
                        <p id="recoveryStatus" class="form-status small" hidden></p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Add machine dialog -->
    <div id="addDialog" class="backdrop" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="addTitle">
            <div class="dialog-head">
                <h2 id="addTitle" data-t="add.title"></h2>
                <button type="button" class="icon-btn dialog-x" id="addClose" data-t-aria="add.close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
            <div id="addSearch" class="searching">
                <span class="radar" aria-hidden="true"></span>
                <span id="addSearchText" class="small" aria-live="polite"></span>
                <button type="button" id="addStop" class="btn" data-t="add.stop"></button>
            </div>
            <p id="addFull" class="warn small" hidden></p>
            <p id="addStatus" class="form-status small" aria-live="polite" hidden></p>
            <div id="addFound"></div>
            <p class="muted small" data-t="add.help"></p>
            <div class="pair-file">
                <p class="small"><span data-t="add.fileLead"></span>
                    <button type="button" id="pairFileToggle" class="link-btn" aria-expanded="false" aria-controls="pairFileBox" data-t="add.fileLink"></button></p>
                <div id="pairFileBox" hidden>
                    <p class="small" data-t="add.fileHelp"></p>
                    <p class="warn small" data-t="add.fileWarn"></p>
                    <div class="field">
                        <label for="pairFileName" data-t="add.name"></label>
                        <input type="text" id="pairFileName" maxlength="31" autocomplete="off">
                    </div>
                    <button type="button" id="pairFileBtn" class="btn" data-t="add.fileBtn"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="strings.js"></script>
    <script src="spark-md5.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
